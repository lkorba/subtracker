# Netlify config for subtracker
# Generated by Hermes Agent — 2026-08-03
#
# Build:
#   - TanStack Start SSR app
#   - Vite builds client + server
#   - Nitro's netlify preset outputs client to ./dist and the function
#     bundle to ./.netlify/functions-internal/server/

[build]
  command = "npm run build"
  # Nitro's netlify preset puts the static client at ./dist (not ./dist/client)
  publish = "dist"
  # Pin to Node 22: TanStack Start + Nitro need modern Node (Netlify default
  # is Node 18 which fails with `crypto.randomUUID is not a function` etc.)
  environment = { NODE_VERSION = "22" }

[functions]
  # Nitro's netlify preset puts the function at
  # .netlify/functions-internal/server. Point Netlify at the parent
  # directory — it auto-discovers the function name from the folder.
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"

[[redirects]]
  # SSR: all non-static routes go through the server function
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
