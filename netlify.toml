# Netlify config for subtracker
# Generated by Hermes Agent — 2026-08-03
#
# Build:
#   - TanStack Start SSR app
#   - Vite builds client + server
#   - Nitro outputs to .netlify/functions-internal and .netlify/v1/functions
#
# Deploy:
#   - Server: Netlify Functions (Node 22 runtime)
#   - Client: Netlify Edge CDN
#   - Env vars: set in Netlify dashboard (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
#     SUPABASE_SERVICE_ROLE_KEY, VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY)

[build]
  command = "npm run build"
  publish = "dist/client"
  # TanStack Start + Nitro require modern Node. Netlify's default is Node 18
  # which fails with `crypto.randomUUID is not a function` etc. Pin to 22.
  environment = { NODE_VERSION = "22" }

[functions]
  # TanStack Start on Nitro produces a function at .netlify/functions-internal/server
  directory = "dist/server"
  node_bundler = "esbuild"

[[redirects]]
  # SSR: all non-static routes go through the server function
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions."server"]
  # TanStack Start uses Node fetch, so this should be fine
  # node_version = "22"
